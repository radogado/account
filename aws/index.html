<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Points App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Points App</h1>
    <div id="auth-container">
      <h2>Register or Login</h2>
      <form id="register-form">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Register</button>
      </form>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          required
        />
        <button type="submit">Login</button>
      </form>
    </div>
    <div id="user-container" style="display: none">
      <h2>Welcome, <span id="username"></span></h2>
      <button id="check-balance">Check Points Balance</button>
      <button id="send-points">Send Points</button>
      <div id="balance"></div>
    </div>

    <!-- Add Amazon Cognito Identity JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.4/dist/amazon-cognito-identity.min.js"></script>
    <!-- Your Script -->
    <script src="script.js"></script>
  </body>
</html>
